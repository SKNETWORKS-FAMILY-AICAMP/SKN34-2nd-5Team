[theme]
base = "light"
primaryColor = "#137A5A"
backgroundColor = "#F7F8F5"
secondaryBackgroundColor = "#EEF2EE"
textColor = "#17211D"
linkColor = "#137A5A"
borderColor = "#D9DED9"
showWidgetBorder = true
baseRadius = "4px"
buttonRadius = "4px"
font = "'Noto Sans KR':https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
headingFont = "'Noto Sans KR':https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;600;700&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontWeights = [700, 650, 600, 600, 600, 600]
chartCategoricalColors = ["#137A5A", "#4C987C", "#9BC3B1", "#D48A43", "#E15D47", "#66746D"]
greenColor = "#247A5B"
greenBackgroundColor = "#E3F1EA"
redColor = "#E15D47"
redBackgroundColor = "#F7E8E5"
orangeColor = "#A66A18"
orangeBackgroundColor = "#FAEFD9"
blueColor = "#356A78"
blueBackgroundColor = "#E6EFF1"
violetColor = "#70567B"
violetBackgroundColor = "#EEE8F1"
dataframeBorderColor = "#DDE4DF"
dataframeHeaderBackgroundColor = "#F1F4F1"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 300
