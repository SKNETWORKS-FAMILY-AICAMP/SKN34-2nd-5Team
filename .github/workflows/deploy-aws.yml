name: Deploy main to AWS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to publish the current main branch"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reviewer-retention-production
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record the commit to deploy
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Validate React
        working-directory: app
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            auth_service/requirements.txt

      - name: Validate Python services
        run: |
          python -m pip install --disable-pip-version-check -r api/requirements.txt -r auth_service/requirements.txt pytest httpx
          python -m compileall -q api auth_service shared
          python -m unittest tests.test_demo_contract tests.test_historical_metric_loaders tests.test_reference_data_seed
          python -m pytest auth_service/tests -q

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out the validated deployment script
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          fetch-depth: 1

      - name: Validate deployment configuration
        shell: bash
        env:
          AWS_SSH_HOST: ${{ secrets.AWS_SSH_HOST }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
          AWS_API_SERVICE: ${{ vars.AWS_API_SERVICE || 'reviewer-retention.service' }}
          AWS_AUTH_SERVICE: ${{ vars.AWS_AUTH_SERVICE || 'reviewer-retention-auth.service' }}
          AWS_DEPLOY_PATH: ${{ vars.AWS_DEPLOY_PATH || '/srv/reviewer-retention' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://52.78.194.110:8000' }}
        run: |
          : "${AWS_SSH_HOST:?Missing AWS_SSH_HOST secret}"
          : "${AWS_SSH_USER:?Missing AWS_SSH_USER secret}"
          : "${AWS_SSH_PRIVATE_KEY:?Missing AWS_SSH_PRIVATE_KEY secret}"
          : "${AWS_SSH_KNOWN_HOSTS:?Missing AWS_SSH_KNOWN_HOSTS secret}"
          : "${AWS_API_SERVICE:?Missing AWS_API_SERVICE variable}"
          : "${AWS_AUTH_SERVICE:?Missing AWS_AUTH_SERVICE variable}"
          : "${AWS_DEPLOY_PATH:?Missing AWS_DEPLOY_PATH variable}"
          : "${VITE_API_BASE_URL:?Missing VITE_API_BASE_URL variable}"

          [[ "$AWS_SSH_HOST" =~ ^[A-Za-z0-9._:-]+$ ]] || { echo "Invalid AWS_SSH_HOST"; exit 1; }
          [[ "$AWS_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid AWS_SSH_USER"; exit 1; }
          [[ "$AWS_API_SERVICE" =~ ^[A-Za-z0-9_.@-]+$ ]] || { echo "Invalid AWS_API_SERVICE"; exit 1; }
          [[ "$AWS_AUTH_SERVICE" =~ ^[A-Za-z0-9_.@-]+$ ]] || { echo "Invalid AWS_AUTH_SERVICE"; exit 1; }
          [[ "$AWS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid AWS_DEPLOY_PATH"; exit 1; }
          [[ "$VITE_API_BASE_URL" =~ ^https?://[^[:space:]]+$ ]] || { echo "Invalid VITE_API_BASE_URL"; exit 1; }

      - name: Configure SSH
        shell: bash
        env:
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$AWS_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy the validated main commit
        shell: bash
        env:
          AWS_SSH_HOST: ${{ secrets.AWS_SSH_HOST }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_API_SERVICE: ${{ vars.AWS_API_SERVICE || 'reviewer-retention.service' }}
          AWS_AUTH_SERVICE: ${{ vars.AWS_AUTH_SERVICE || 'reviewer-retention-auth.service' }}
          AWS_DEPLOY_PATH: ${{ vars.AWS_DEPLOY_PATH || '/srv/reviewer-retention' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://52.78.194.110:8000' }}
          EXPECTED_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: |
          remote_script="/tmp/reviewer-retention-deploy-${EXPECTED_SHA}.sh"
          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            scripts/deploy_server.sh \
            "$AWS_SSH_USER@$AWS_SSH_HOST:$remote_script"

          printf -v cleanup_command 'rm -f -- %q' "$remote_script"
          printf -v remote_command \
            'set -Eeuo pipefail; trap %q EXIT; cd %q && EXPECTED_SHA=%q API_SERVICE=%q AUTH_SERVICE=%q VITE_API_BASE_URL=%q bash %q' \
            "$cleanup_command" "$AWS_DEPLOY_PATH" "$EXPECTED_SHA" "$AWS_API_SERVICE" "$AWS_AUTH_SERVICE" "$VITE_API_BASE_URL" "$remote_script"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$AWS_SSH_USER@$AWS_SSH_HOST" \
            "$remote_command"

      - name: Remove temporary SSH key
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key"
