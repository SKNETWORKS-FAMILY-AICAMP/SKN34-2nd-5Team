name: CI

on:
  pull_request:
    branches:
      - release/finalization
      - main
  push:
    branches:
      - release/finalization
      - main

permissions:
  contents: read

jobs:
  python-validation:
    name: Python Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            auth_service/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r api/requirements.txt -r auth_service/requirements.txt pytest httpx

      - name: Compile Python sources
        run: python -m compileall -q api auth_service shared scripts

      - name: Run artifact-free contract tests
        run: python -m unittest tests.test_demo_contract tests.test_historical_metric_loaders tests.test_reference_data_seed

      - name: Run API and auth tests
        run: python -m pytest api/tests auth_service/tests -q

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
