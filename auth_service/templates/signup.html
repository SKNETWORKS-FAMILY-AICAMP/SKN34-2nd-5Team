{% extends "base.html" %}
{% block page_id %}signup{% endblock %}
{% block content %}
<section class="auth-card" aria-labelledby="signup-title">
  <p class="eyebrow">운영 담당자 계정 신청</p>
  <h1 id="signup-title">회원가입</h1>
  <p class="lead">신청 내용을 확인한 뒤 관리자가 서비스 접근을 승인합니다.</p>

  <form id="signup-form" class="form-stack">
    <label>
      이름
      <input name="full_name" autocomplete="name" minlength="2" maxlength="100" required />
    </label>
    <label>
      이메일
      <input name="email" type="email" autocomplete="email" required />
    </label>
    <div class="form-grid">
      <label>
        소속
        <input name="organization" maxlength="120" placeholder="예: 콘텐츠 운영팀" />
      </label>
      <label>
        신청 역할
        <select name="requested_role">
          <option>운영 담당자</option>
          <option>CRM 담당자</option>
          <option>서비스 기획자</option>
          <option>데이터 분석가</option>
        </select>
      </label>
    </div>
    <label>
      가입 사유
      <textarea name="signup_reason" maxlength="500" rows="3" placeholder="서비스 이용 목적을 간단히 적어 주세요."></textarea>
    </label>
    <div class="form-grid">
      <label>
        비밀번호
        <input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
      </label>
      <label>
        비밀번호 확인
        <input name="password_confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
      </label>
    </div>
    <p class="form-hint">8자 이상 입력해 주세요. 비밀번호는 원문으로 저장되지 않습니다.</p>
    <div id="form-message" class="message" role="alert" hidden></div>
    <button class="primary-button" type="submit">가입 승인 요청</button>
  </form>
  <p class="card-footer">이미 계정이 있나요? <a href="/auth/login">로그인</a></p>
</section>
{% endblock %}
